id: permark
name: PerMarkdescription: Desktop Markdown IDE for post-AI engineering. Inspect open document context, search tagged specs via BM25, read shared notes, and resolve inline review comments.
author: EdelmarSchneider
url: https://github.com/EdelmarSchneider/permark
category: development
suggest_for:
  filename:
    - "*.md"
    - "*.markdown"
content:
  - name: PerMark Desktop (Native CLI)
    prerequisites:
      - PerMark installed (Scoop, Homebrew, Snap, deb-get, or binary release)
    content: |
      {
        "command": "permark",
        "args": ["mcp"]
      }
